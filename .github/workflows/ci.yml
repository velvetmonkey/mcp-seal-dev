# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: leanprover/lean-action@v1.5.0
        with:
          use-github-cache: false
          build: false
      - run: lake build
      - run: lake exe automaton_tests
      - run: lake exe axiom_check 2>&1 | tee /tmp/axioms.txt
      - run: "! grep -E 'sorryAx|Lean\\.ofReduceBool' /tmp/axioms.txt"
      - run: lake exe v2_parse_tests
      - run: lake exe v2_m1_axiom_check 2>&1 | tee /tmp/v2-m1-axioms.txt
      - run: "! grep -E 'sorryAx|Lean\\.ofReduceBool' /tmp/v2-m1-axioms.txt"
      - run: lake exe v2_validate_tests
      - run: lake exe v2_m2_axiom_check 2>&1 | tee /tmp/v2-m2-axioms.txt
      - run: "! grep -E 'sorryAx|Lean\\.ofReduceBool' /tmp/v2-m2-axioms.txt"
      - run: lake exe v2_serialize_tests
      - run: lake exe v2_m3_parser_axiom_check 2>&1 | tee /tmp/v2-m3-parser-axioms.txt
      - run: "! grep -E 'sorryAx|Lean\\.ofReduceBool' /tmp/v2-m3-parser-axioms.txt"
      - run: lake exe v2_m3_axiom_check 2>&1 | tee /tmp/v2-m3-axioms.txt
      - run: "! grep -E 'Lean\\.ofReduceBool' /tmp/v2-m3-axioms.txt"
      - run: python3 test/integration/test_seal.py
      - run: python3 test/v2/m1_adversarial_mcp_fixture.py
      - run: python3 test/v2/m2_adversarial_mcp_fixture.py
      - run: python3 test/v2/m3_serialization_fixture.py
