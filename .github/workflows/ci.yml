name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: leanprover/lean-action@v1.5.0
        with:
          use-github-cache: false
          build: false
          test: false
          lint: false
      - run: bash c/build.sh
      - run: lake build
      - run: lake exe automaton_tests
      - run: lake exe policy_bundle_tests
      - run: lake exe policy_v2_tests
      - run: lake exe policy_diff_tests
      - run: lake exe scaffold_tests
      - name: Axiom allowlist
        run: |
          set -o pipefail
          lake exe axiom_check 2>&1 | tee /tmp/axioms.txt
      - run: lake exe v2_parse_tests
      - name: M1 axiom allowlist
        run: |
          set -o pipefail
          lake exe v2_m1_axiom_check 2>&1 | tee /tmp/v2-m1-axioms.txt
      - run: lake exe v2_validate_tests
      - name: M2 axiom allowlist
        run: |
          set -o pipefail
          lake exe v2_m2_axiom_check 2>&1 | tee /tmp/v2-m2-axioms.txt
      - run: lake exe v2_serialize_tests
      - name: M3 parser axiom allowlist
        run: |
          set -o pipefail
          lake exe v2_m3_parser_axiom_check 2>&1 | tee /tmp/v2-m3-parser-axioms.txt
      - name: M3 axiom allowlist
        run: |
          set -o pipefail
          lake exe v2_m3_axiom_check 2>&1 | tee /tmp/v2-m3-axioms.txt
      - name: M4 axiom allowlist
        run: |
          set -o pipefail
          lake exe v2_m4_axiom_check 2>&1 | tee /tmp/v2-m4-axioms.txt
      - name: M6 axiom allowlist
        run: |
          set -o pipefail
          lake exe v2_m6_axiom_check 2>&1 | tee /tmp/v2-m6-axioms.txt
      - run: lake exe v2_lifecycle_tests
      - name: M.2 adapter revision-set control
        run: lake exe m2_adapter_revision_set
      - name: M.7 per-request version-gate control
        run: lake exe m7_version_gate
      - name: K5 framing control
        run: lake exe k5_framing_show
      - name: Classifier partition control
        run: lake exe classify_enum
      - name: Numeric agreement control
        run: lake exe numeric_agreement_show
      - name: Escape-event non-influence control
        run: lake exe escape_events_show
      - name: Nonce-ledger control
        run: lake exe nonce_ledger_show
      - name: Field-warrant controls
        run: lake exe field_warrant_tests
      - name: Field-warrant negative-witness control
        run: lake exe field_warrant_mutation
      - name: Channel symlink-refusal control
        run: lake exe channel_tests
      - name: M.1 metadata identity controls
        run: lake exe meta_identity_controls
      - name: M.4 MRTR identity and mediation controls
        run: lake exe mrtr_identity_controls
      - name: M.1 V2 metadata identity and cross-layer controls
        run: lake exe v2_meta_identity_controls
      - name: M.4 V2 MRTR identity, signed-shape, and cross-layer controls
        run: lake exe v2_mrtr_identity_controls
      - run: python3 test/integration/test_seal.py
      - run: python3 test/integration/test_mrtr_fail_closed.py
      - run: python3 test/v2/m1_adversarial_mcp_fixture.py
      - run: python3 test/v2/m2_adversarial_mcp_fixture.py
      - run: python3 test/v2/m3_serialization_fixture.py
      - run: python3 test/v2/m4_adversarial_mcp_fixture.py
      - run: python3 test/v2/m5_sign_fixture.py
      # The Lean half of the kit's scan differential. The kit's own CI proves
      # JS ≡ pinned-oracle-output on every run (it ships no Lean toolchain);
      # THIS step proves live Lean scanPass ≡ that same pin ≡ the corpus's
      # expected verdicts, by running the kit's own bridge against this
      # checkout. Together they are the full differential in automation —
      # the warrant scan.cjs prints claims exactly this mechanism. The token
      # is REQUIRED, not optional: a silently-skipped leg is precisely the
      # never-fires pattern this step exists to kill.
      - name: Require kit checkout access for the scan differential
        env:
          SEAL_CI_READ_TOKEN: ${{ secrets.SEAL_CI_READ_TOKEN }}
        run: |
          test -n "$SEAL_CI_READ_TOKEN" || {
            echo "::error::SEAL_CI_READ_TOKEN is required; the scan differential was not run."
            exit 1
          }
      - name: Check out seal-assurance-kit
        uses: actions/checkout@v6.0.3
        with:
          repository: velvetmonkey/seal-assurance-kit
          token: ${{ secrets.SEAL_CI_READ_TOKEN }}
          path: seal-assurance-kit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: kit scan differential (JS vs live Lean vs expected, + pin freshness)
        run: |
          cd seal-assurance-kit
          SCAN_LEAN_ROOT="$GITHUB_WORKSPACE" node scripts/scan_bridge.mjs
      - run: lake build ffi_shared
      - run: bash scripts/build_ffi_so.sh
      - run: |
          cd rust
          ROOT="$(cd .. && pwd)"
          LEANPREFIX="$(cd .. && lean --print-prefix)"
          SEAL_FFI_LIB_DIR="$ROOT/.lake/build/lib" \
          LEAN_LIB_DIR="$LEANPREFIX/lib/lean" \
          LD_LIBRARY_PATH="$ROOT/.lake/build/lib:$LEANPREFIX/lib/lean" \
          cargo run --quiet
      - name: snapshot-drift gate (committed evidence must match a fresh run)
        run: |
          for d in 01-parse 02-validate 03-serialize 04-decide 05-sign 06-lifecycle 07-host; do
            bash "v2/milestones/$d/run.sh" > /dev/null
          done
          if [ -n "$(git status --porcelain -- v2/milestones/)" ]; then
            echo "snapshot drift: committed evidence does not match a fresh run:"
            git status --porcelain -- v2/milestones/
            git --no-pager diff -- v2/milestones/ | head -80
            exit 1
          fi
          echo "snapshot-drift gate: evidence is fresh"
      # Module-aware: 25 regular kernel modules use the three-name baseline;
      # Ffi alone uses the four-name unsafe compiled-code-root baseline.
      - name: Module-aware axiom baselines (25 kernel modules + Ffi)
        run: |
          set -o pipefail
          lake exe module_axiom_check 2>&1 | tee /tmp/module-wide-axioms.txt

  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/claims-drift.mjs
