name = "mcp-seal"
version = "0.1.0"
defaultTargets = ["seal"]

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries.git"
rev = "v4.28.0"

[[lean_lib]]
name = "SealCore"

[[lean_lib]]
name = "Seal"

[[lean_lib]]
name = "SealV2"

[[lean_lib]]
name = "Test"
globs = ["Test.+"]

[[lean_exe]]
name = "seal"
root = "Seal.Main"

[[lean_exe]]
name = "automaton_tests"
root = "Test.Automaton"

[[lean_exe]]
name = "axiom_check"
root = "Test.Axioms"

[[lean_exe]]
name = "v2_parse_tests"
root = "Test.V2Parse"

[[lean_exe]]
name = "v2_m1_axiom_check"
root = "Test.V2M1Axioms"

[[lean_exe]]
name = "v2_parse_line"
root = "Test.V2ParseLine"
